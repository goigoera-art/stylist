<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Личный стилист</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: узкая колонка как в приложении, нижняя навигация из трёх экранов, образы — карточки по стилям */
:root{
  --bg:#eceef3; --surface:#ffffff; --ink:#13141a; --muted:#686c79; --line:#dadde6;
  --accent:#3c3dff; --accent-ink:#ffffff; --soft:#e5e6ff; --warn:#b4540a; --warn-bg:#fdeedd;
  --ok:#17794a;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f14; --surface:#171922; --ink:#f0f1f6; --muted:#9a9eae; --line:#2a2d3a;
    --accent:#8e90ff; --accent-ink:#0e0f14; --soft:#25274d; --warn:#f0a35e; --warn-bg:#3a2a17; --ok:#58cf92;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f14; --surface:#171922; --ink:#f0f1f6; --muted:#9a9eae; --line:#2a2d3a;
  --accent:#8e90ff; --accent-ink:#0e0f14; --soft:#25274d; --warn:#f0a35e; --warn-bg:#3a2a17; --ok:#58cf92;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.1;margin:10px 0 6px}
h2{font-size:20px}
h3{font-size:16px}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.small{font-size:13px;color:var(--muted)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;color:var(--muted);
  text-decoration:none;font-size:12px;font-weight:500}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--accent)}

/* controls */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;line-height:1.2}
button.chip[aria-pressed="true"],button.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;font-variant-numeric:tabular-nums}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,140,.5);flex:none;display:inline-block}
.panel{background:var(--surface);border-radius:20px;padding:16px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);
  border-radius:16px;padding:12px 14px;margin:8px 0 12px;font-size:13px}
.banner b{font-weight:600}

/* upload */
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:30px 18px;border:2px dashed var(--line);
  border-radius:24px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop strong{font-family:var(--font-display);font-size:19px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0 0}
.tip{font-size:13px;color:var(--muted);padding:10px 12px;border-radius:14px;background:var(--surface)}
.queue{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.qrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px}
.qrow .th{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--bg)}
.qrow .th img,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.qrow .bd{min-width:0;display:flex;flex-direction:column;gap:6px}
.qrow .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
select,.fld{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.stat-ok{color:var(--ok);font-size:12px;font-weight:600}
.stat-warn{color:var(--warn);font-size:12px;font-weight:600}

/* wardrobe */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{background:var(--surface);border-radius:18px;padding:8px;border:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);display:grid;place-items:center;position:relative}
.thumb svg{width:70%;height:70%}
.item .t{font-weight:600;font-size:14px;padding:0 4px;overflow-wrap:anywhere}
.item .m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 4px 4px;font-size:12px;color:var(--muted)}
.board{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.slot{position:absolute;display:grid;place-items:center}
.slot img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.slot svg{width:100%;height:100%}
.better{background:var(--soft);border-radius:16px;padding:12px 14px}
.better .why li svg{color:var(--accent)}
.acclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.acclist li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;font-size:14px}
.acclist .thumb{background:#fff;border:1px solid var(--line)}
.acclist b{font-weight:600}
.acclist p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.dots{display:inline-flex;flex:none}
.dots .sw+.sw{margin-left:-5px}
.addcard{border:2px dashed var(--line);background:transparent;color:var(--muted);align-items:center;justify-content:center;min-height:150px;text-decoration:none;font-weight:600;font-size:14px;text-align:center}

/* looks */
.filters{display:flex;flex-direction:column;gap:14px}
.frow{display:flex;flex-direction:column;gap:7px}
.fhead{display:flex;justify-content:space-between;align-items:center}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary .car{transform:rotate(180deg)}
.car{transition:transform .15s;width:18px;height:18px}
.sect{margin-top:26px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.sect-d{color:var(--muted);font-size:13px;margin:0 0 12px}
.looks{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:760px){.looks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.look{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.look .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.look .ttl{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.score{flex:none;text-align:center;border-radius:12px;background:var(--soft);color:var(--accent);padding:5px 9px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.collage{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.collage .thumb{border-radius:12px}
.ilist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ilist li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.ilist li span.nm{font-weight:500;overflow-wrap:anywhere}
.ilist li span.cat{color:var(--muted);font-size:12px;margin-left:auto;text-align:right;flex:none}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px}
.why li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px}
.why li svg{width:18px;height:18px;color:var(--accent);margin-top:1px}
.where{display:flex;flex-direction:column;gap:6px}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink)}
.pill.o{background:var(--soft);color:var(--accent);font-weight:600}
.more{margin:14px auto 0;display:block}
.gap{background:var(--warn-bg);border-radius:20px;padding:16px;margin-top:26px}
.gap h3{color:var(--warn);margin-bottom:8px}
.gap ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,10,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:24px}}
.sheet .row{display:flex;flex-direction:column;gap:7px}
.sheet input[type=text]{width:100%}
.sheet input[type=range]{width:100%;accent-color:var(--accent)}
.sheet .acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:13px;max-width:90%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Личный <i>стилист</i></div>
    <span class="small" id="count"></span>
  </header>
  <main id="screen"></main>
</div>

<nav class="tabs" aria-label="Разделы"><div class="in">
  <a href="#upload" data-tab="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.2-1.8h6.6L16.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>Добавить</a>
  <a href="#wardrobe" data-tab="wardrobe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7a2 2 0 1 0-2-2"/><path d="M12 7v2L3.5 15.2A1.5 1.5 0 0 0 4.4 18h15.2a1.5 1.5 0 0 0 .9-2.8L12 9"/></svg>Гардероб</a>
  <a href="#looks" data-tab="looks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>Образы</a>
</div></nav>

<script>
/* ===================== данные ===================== */
const CATS={tops:'Верх',bottoms:'Низ',outer:'Верхняя одежда',dresses:'Платья',shoes:'Обувь',acc:'Аксессуары'};
const STYLES={
  casual:{n:'Casual',d:'Повседневно и удобно: вещи, в которых комфортно целый день.',why:'Расслабленные вещи без строгих деталей: удобно носить с утра до вечера.'},
  streetwear:{n:'Streetwear',d:'Уличный характер: объём, кроссовки, худи и куртки.',why:'Свободные силуэты и спортивные детали дают уличный характер.'},
  business:{n:'Business',d:'Деловые образы для офиса, встреч и переговоров.',why:'Вещи одного делового уровня: аккуратные линии, ничего лишнего.'},
  minimal:{n:'Minimal',d:'Спокойная палитра и чистые линии, без лишнего декора.',why:'Спокойные формы без принтов: образ держится на линиях и цвете.'},
  sporty:{n:'Sporty',d:'Функциональные комплекты для движения и активного дня.',why:'Функциональные вещи, в которых удобно двигаться.'},
  evening:{n:'Вечерний',d:'Нарядные образы для ужина, театра и праздника.',why:'Нарядные вещи выглядят собранно при вечернем свете.'}
};
const SEASONS=['Весна','Лето','Осень','Зима'];
const WEATHER={hot:'Жара 25°+',warm:'Тепло 18–25°',cool:'Прохладно 8–18°',cold:'Холодно до 8°'};
const OCC={
  work:{n:'Работа',styles:['business','minimal'],min:3,max:9,t:'офис и деловые встречи'},
  date:{n:'Свидание',styles:['evening','minimal','casual'],min:2,max:9,t:'ужин, кино или свидание'},
  walk:{n:'Прогулка',styles:['casual','streetwear','minimal'],min:0,max:3.5,t:'прогулка и кофе с друзьями'},
  party:{n:'Вечеринка',styles:['evening','streetwear'],min:2,max:9,t:'вечеринка, бар или концерт'},
  sport:{n:'Спорт',styles:['sporty'],min:0,max:9,t:'тренировка и активный день'},
  trip:{n:'Поездка',styles:['casual','sporty','minimal','streetwear'],min:0,max:2.5,t:'путешествие и долгая дорога'}
};
const OCC_NEED={work:'рубашка или блузка, брюки, туфли или лоферы',date:'нарядный верх или платье, брюки или юбка, аккуратная обувь',
  walk:'футболка или худи, джинсы, кроссовки',party:'нарядный топ или платье, брюки, туфли или куртка в уличном стиле',
  sport:'спортивная футболка, спортивные штаны, кроссовки',trip:'удобная футболка или худи, джинсы или спортивные штаны, кроссовки'};
const COLORS=[
 ['black','чёрный','#1b1b1f',1],['white','белый','#f3f3f1',1],['grey','серый','#8d9097',1],['beige','бежевый','#d9c6a6',1],
 ['brown','коричневый','#7a5638',1],['navy','тёмно-синий','#1f2c4c',1],['denim','джинсовый','#4b6a96',1],['khaki','хаки','#a89a6a',1],
 ['olive','оливковый','#6a6c3b',0],['red','красный','#c62d2d',0],['burgundy','бордовый','#6d1f2f',0],['orange','оранжевый','#e8812a',0],
 ['yellow','жёлтый','#f0c93a',0],['green','зелёный','#3f8a4e',0],['teal','бирюзовый','#1f7f80',0],['blue','синий','#2f64c8',0],
 ['purple','фиолетовый','#7c4aa8',0],['pink','розовый','#e68ab0',0]];
const CK=Object.fromEntries(COLORS.map(c=>[c[0],{key:c[0],ru:c[1],hex:c[2],neutral:!!c[3]}]));
/* name, cat, warmth, formality 1-5, fit, styles(first=main), seasons(0 весна..3 зима), rain */
const P=[
 ['Футболка','tops',1,1,'regular','casual,streetwear,sporty,minimal','012'],
 ['Рубашка','tops',1,4,'regular','business,minimal,casual','0123'],
 ['Блузка','tops',1,4,'slim','business,evening,minimal','0123'],
 ['Топ','tops',1,3,'slim','evening,casual,minimal','01'],
 ['Лонгслив','tops',2,1,'slim','casual,minimal,streetwear','023'],
 ['Свитер','tops',3,2,'regular','casual,minimal,business','23'],
 ['Худи','tops',3,1,'oversize','streetwear,casual,sporty','023'],
 ['Спортивная футболка','tops',1,1,'regular','sporty','012'],
 ['Джинсы','bottoms',2,2,'regular','casual,streetwear','0123'],
 ['Брюки','bottoms',2,4,'slim','business,minimal,evening','0123'],
 ['Широкие брюки','bottoms',2,3,'oversize','streetwear,minimal,casual','0123'],
 ['Юбка','bottoms',1,3,'regular','evening,business,casual,minimal','012'],
 ['Шорты','bottoms',1,1,'regular','casual,sporty,streetwear','1'],
 ['Спортивные штаны','bottoms',2,1,'regular','sporty,streetwear,casual','0123'],
 ['Лёгкая куртка','outer',2,2,'regular','casual,streetwear,sporty','02'],
 ['Ветровка','outer',2,1,'regular','casual,sporty,streetwear','012',1],
 ['Плащ','outer',2,4,'regular','business,minimal,evening','02',1],
 ['Бомбер','outer',2,1,'regular','streetwear,casual,sporty','02'],
 ['Кожаная куртка','outer',3,3,'slim','streetwear,evening,casual','02'],
 ['Пиджак','outer',2,5,'slim','business,minimal,evening','02'],
 ['Пальто','outer',4,4,'regular','business,minimal,evening,casual','23'],
 ['Пуховик','outer',4,1,'oversize','casual,streetwear,sporty','3'],
 ['Платье','dresses',1,2,'regular','casual,minimal','012'],
 ['Вечернее платье','dresses',1,5,'slim','evening','0123'],
 ['Кроссовки','shoes',2,1,'regular','casual,streetwear,sporty,minimal','0123'],
 ['Туфли','shoes',2,5,'slim','business,evening,minimal','0123'],
 ['Лоферы','shoes',2,4,'slim','business,minimal,casual','012'],
 ['Ботинки','shoes',3,3,'regular','casual,streetwear,minimal,business','023'],
 ['Сандалии','shoes',1,2,'regular','casual,minimal','1'],
 ['Сумка','acc',0,3,'regular','casual,business,minimal,evening','0123'],
 ['Рюкзак','acc',0,1,'regular','casual,streetwear,sporty','0123'],
 ['Шарф','acc',1,2,'regular','casual,minimal,business,streetwear','23'],
 ['Кепка','acc',0,1,'regular','casual,streetwear,sporty','012'],
 ['Ремень','acc',0,3,'regular','business,casual,minimal,streetwear','0123'],
 ['Украшения','acc',0,4,'slim','evening,minimal,casual,business','0123'],
 ['Серьги','acc',0,4,'slim','evening,minimal,casual,business','0123'],
 ['Браслет','acc',0,3,'slim','minimal,evening,casual,business,streetwear','0123'],
 ['Часы','acc',0,4,'regular','business,minimal,casual,sporty,evening,streetwear','0123'],
 ['Очки','acc',0,2,'regular','casual,streetwear,minimal,sporty,evening','012'],

function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function colorKey(hex){const [r,g,b]=hexRgb(hex);return colorKeyRGB(r,g,b);}
function colorKeyRGB(r,g,b){let best=null,bd=1e9;
  for(const c of COLORS){const [r2,g2,b2]=hexRgb(c[2]);const rm=(r+r2)/2;
    const d=(2+rm/256)*(r-r2)**2+4*(g-g2)**2+(2+(255-rm)/256)*(b-b2)**2;if(d<bd){bd=d;best=c[0];}}
  return best;}
function hue(hex){let [r,g,b]=hexRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;
  let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;return h<0?h+360:h;}

function harmony(its){

    const match=others.filter(i=>pc.includes(i.color));

      :`Главная вещь образа — «${p.name}» (${cl}). Остальное спокойное, поэтому рисунок не спорит с одеждой.`;
    if(match.length){s+=6;text+=` ${match.map(i=>i.name).join(' и ')}: цвет повторяет цвет из рисунка (${CK[match[0].color].ru}).`;}
    return{s,type:'print',text,keys:allKeys,acc:[],pat:p};
  }
  const keys=[...new Set(its.map(i=>i.color))];const acc=keys.filter(k=>!CK[k].neutral);const names=k=>CK[k].ru;
  let s,type,text;
  if(keys.length===1){s=78;type='mono';text=keys[0]==='black'?'Полностью чёрный образ: строго, стильно и без риска ошибиться с цветом.':`Всё в одном цвете («${names(keys[0])}»): образ выглядит цельно и дорого.`;}
  else if(acc.length===0){s=84;type='neutral';text=`Нейтральная палитра (${keys.map(names).join(', ')}): цвета спокойно сочетаются между собой.`;
    if(keys.some(isLight)&&keys.some(isDark)){s+=4;text+=' Светлое и тёмное уравновешивают друг друга.';}

  else if(acc.length===1){s=90;type='accent';text=`Нейтральная база и один акцент — ${names(acc[0])}. Взгляд идёт к одному яркому пятну, образ не пестрит.`;}
  else if(acc.length===2){const d0=Math.abs(hue(CK[acc[0]].hex)-hue(CK[acc[1]].hex)),d=Math.min(d0,360-d0);
    if(d<=40){s=80;type='analog';text=`Два близких оттенка (${names(acc[0])} и ${names(acc[1])}) мягко переходят друг в друга.`;}
    else if(d>=150&&d<=210){s=76;type='compl';text=`${names(acc[0])} и ${names(acc[1])} — контрастная пара, а нейтральные вещи не дают ей спорить.`;}

  return{s,type,text,keys,acc};
}
function title(h){
  const n=k=>CK[k].ru;

  if(h.type==='mono')return h.keys[0]==='black'?'Total black':'Один цвет: '+n(h.keys[0]);
  if(h.type==='neutral')return 'Нейтральная палитра';
  if(h.type==='accent')return 'Акцент: '+n(h.acc[0]);
  if(h.type==='analog')return 'Тон в тон: '+n(h.acc[0])+' и '+n(h.acc[1]);

}
function buildAll(){
  const sg=sig();if(_cache&&_cache.sg===sg)return _cache.looks;
  const by=c=>S.items.filter(i=>i.cat===c);
  const tops=by('tops'),bots=by('bottoms'),dr=by('dresses'),outs=by('outer'),sh=by('shoes'),accs=by('acc');
  const bases=[];tops.forEach(t=>bots.forEach(b=>bases.push([t,b])));dr.forEach(d=>bases.push([d]));
  const looks=[];
  for(const base of bases)for(const o of [null,...outs])for(const s of (sh.length?sh:[null])){
    const core=[...base,...(s?[s]:[])];const all=o?[...core,o]:core;
    const seas=[0,1,2,3].filter(x=>all.every(i=>i.seasons.includes(x)));if(!seas.length)continue;
    const fs=all.map(i=>i.f);const spread=Math.max(...fs)-Math.min(...fs);if(spread>=3)continue;
    const h=harmony(all);if(h.s<55)continue;
    // стили, подходящие ВСЕМ вещам
    let best=null;
    for(const st of Object.keys(STYLES)){
      if(!all.every(i=>i.styles.includes(st)))continue;
      const fAvg=fs.reduce((a,b)=>a+b,0)/fs.length;
      if(st==='sporty'&&Math.max(...fs)>2)continue;
      if(st==='streetwear'&&Math.max(...fs)>3)continue;
      if((st==='business')&&fAvg<3)continue;
      if(st==='evening'&&fAvg<2.5)continue;
      const aff=all.reduce((a,i)=>a+Math.max(1,3-i.styles.indexOf(st)),0)/all.length;
      if(!best||aff>best.aff)best={st,aff};
    }
    if(!best)continue;
    const fAvg=fs.reduce((a,b)=>a+b,0)/fs.length;
    let sc=h.s;const top=base.length===2?base[0]:null,bot=base.length===2?base[1]:null;
    let fitNote=null;
    if(top&&bot){
      if((top.fit==='oversize'&&bot.fit==='slim')||(top.fit==='slim'&&bot.fit==='oversize')||(top.fit==='regular'&&bot.fit!=='regular'&&bot.fit!==top.fit)||(bot.fit==='regular'&&top.fit!=='regular')){sc+=6;
        fitNote=`Баланс силуэта: ${FITS[top.fit]} верх и ${FITS[bot.fit]} низ уравновешивают друг друга.`;}
      else if(top.fit==='oversize'&&bot.fit==='oversize'&&best.st==='streetwear'){sc+=3;fitNote='Свободный верх и свободный низ: фирменный объёмный силуэт streetwear.';}
      else if(top.fit==='slim'&&bot.fit==='slim'){sc+=2;fitNote='Облегающие вещи держат чёткий силуэт.';}
      else fitNote=`Силуэт ровный: ${FITS[top.fit]} верх и ${FITS[bot.fit]} низ.`;
    }else if(base.length===1){fitNote=`Платье задаёт силуэт само: ${FITS[base[0].fit]} крой, остальное лишь дополняет.`;}
    if(s)sc+=3;
    if(spread===2)sc-=15;else if(spread===1)sc-=3;
    const warm=all.reduce((a,i)=>a+i.w,0);
    looks.push({id:looks.length,style:best.st,base,outer:o,shoes:s,items:all,core,score:Math.min(99,Math.round(sc)),h,fitNote,spread,fAvg,seasons:seas,warm,
      colors:[...new Set(all.flatMap(i=>i.colors))],hasPat:all.some(i=>i.pattern!=='solid')});
  }
  for(const l of looks){l.weather=weatherOf(l);l.rainOk=!!(l.outer&&l.outer.rain&&(!l.shoes||l.shoes.w>=2));
    l.occ=Object.keys(OCC).filter(k=>{const o=OCC[k];return o.styles.includes(l.style)&&l.fAvg>=o.min&&l.fAvg<=o.max;});}
  _cache={sg,looks};return looks;
}
function weatherOf(l){
  const r=[],o=l.outer,top=l.base.length===2?l.base[0]:l.base[0],sh=l.shoes;
  const hasHeavyTop=l.base.some(i=>i.w>=3);
  if(!o&&l.warm<=4&&!hasHeavyTop)r.push('hot');
  if((!o||o.w<3)&&l.warm<=6&&!hasHeavyTop||(!o&&l.warm<=6))r.push('warm');
  if(l.warm>=5&&l.warm<=9&&(!o||o.w<=3)&&(!sh||sh.w>=2))r.push('cool');
  if(o&&o.w>=3&&l.warm>=9&&top.w>=2&&(!sh||sh.w>=2))r.push('cold');

}
function accFor(l){
  const accs=S.items.filter(i=>i.cat==='acc'&&i.styles.includes(l.style)&&l.seasons.some(s=>i.seasons.includes(s)));
  const ok=accs.filter(a=>CK[a.color].neutral||l.colors.includes(a.color));
  ok.sort((a,b)=>(a.styles.indexOf(l.style)-b.styles.indexOf(l.style)));
  return ok[0]||null;
}
function passes(l,f,skip){
  if(skip!=='season'&&f.season!==null&&!l.seasons.includes(f.season))return false;
  if(skip!=='weather'&&f.weather&&!l.weather.includes(f.weather))return false;
  if(skip!=='rain'&&f.rain&&!l.rainOk)return false;
  if(skip!=='occ'&&f.occ&&!l.occ.includes(f.occ))return false;
  if(skip!=='colors'&&f.colors.length&&!f.colors.some(c=>l.colors.includes(c)))return false;
  if(skip!=='pat'&&f.pat==='with'&&!l.hasPat)return false;
  if(skip!=='pat'&&f.pat==='without'&&l.hasPat)return false;
  return true;
}
function curate(){
  const f=S.f,res={};
  const list=buildAll().filter(l=>passes(l,f));
  const fav=l=>f.colors.filter(c=>l.colors.includes(c)).length;
  list.sort((a,b)=>fav(b)-fav(a)||b.score-a.score);
  for(const l of list){
    const arr=res[l.style]=res[l.style]||[];
    if(arr.length>=16)continue;
    const baseKey=l.base.map(i=>i.id).join('+');
    if(arr.some(x=>x.base.map(i=>i.id).join('+')===baseKey&&x.shoes===l.shoes))continue;
    const sameBase=arr.filter(x=>x.base.map(i=>i.id).join('+')===baseKey).length;if(sameBase>=2)continue;
    const use={};arr.forEach(x=>x.items.forEach(i=>use[i.id]=(use[i.id]||0)+1));
    if(l.items.some(i=>(use[i.id]||0)>=4))continue;
    arr.push(l);
  }
  return res;
}
function gaps(){
  const it=S.items,out=[],cnt=c=>it.filter(i=>i.cat===c).length;
  const sug=(cat,st)=>{const p=P.find(p=>p.cat===cat&&p.styles[0]===st)||P.find(p=>p.cat===cat&&p.styles.includes(st));return p?p.name.toLowerCase():null;};
  if(it.length<6)out.push(`В гардеробе только ${it.length} ${plural(it.length,'вещь','вещи','вещей')}. Добавьте ещё хотя бы ${6-it.length}: чем больше вещей, тем больше сочетаний.`);
  if(!cnt('tops')&&!cnt('dresses'))out.push('Нет верха и платьев: добавьте футболку, рубашку или свитер.');
  if(!cnt('bottoms')&&!cnt('dresses'))out.push('Нет низа: добавьте джинсы, брюки или юбку.');
  if((cnt('tops')||cnt('dresses'))&&!cnt('shoes'))out.push('Нет обуви: образы собраны без неё. Добавьте кроссовки или туфли.');
  if(!cnt('outer'))out.push('Нет верхней одежды: без куртки или пальто не получится подобрать образы на прохладную и холодную погоду.');
  else{
    if(!it.some(i=>i.cat==='outer'&&i.w>=3))out.push('Для холодной погоды нужна тёплая верхняя одежда (пальто или пуховик).');
    if(!it.some(i=>i.cat==='outer'&&i.rain))out.push('Для дождя нет подходящей вещи: добавьте ветровку или плащ либо отметьте «Защищает от дождя» в карточке куртки.');
  }
  const base=it.filter(i=>i.pattern==='solid'&&CK[i.color].neutral&&(i.cat==='tops'||i.cat==='bottoms')).length;
  if(it.length>=4&&base<3)out.push('Мало нейтральной базы: белая футболка, чёрные брюки или тёмные джинсы помогут сочетать яркие вещи.');
  if(it.length>=4&&!it.some(i=>subOf(i)==='jewelry'))out.push('Нет украшений: серьги, браслет или часы завершают образ и делают его дороже.');
  if(it.length>=4&&!it.some(i=>subOf(i)==='bag'))out.push('Нет сумки: она нужна почти каждому образу, лучше нейтрального цвета.');

  for(const st of Object.keys(STYLES)){

    const need=[];
    const bt=['tops','bottoms','shoes'].filter(c=>!it.some(i=>i.cat===c&&i.styles.includes(st)));
    for(const c of bt){const n=sug(c,st);if(n)need.push(n);}
    if(!it.some(i=>i.cat==='dresses'&&i.styles.includes(st))&&need.length===3&&st==='evening')need.push('вечернее платье');
    if(need.length)out.push(`Для стиля ${STYLES[st].n} не хватает: ${need.join(', ')}.`);
  }

function explainEmpty(){

  if(f.season!==null&&only('season',l=>l.seasons.includes(f.season))){
    const need=[ 'футболка или рубашка, лёгкие брюки, кроссовки','футболка, шорты или юбка, сандалии или кроссовки','свитер или лонгслив, джинсы, лёгкая куртка, ботинки','пальто или пуховик, свитер, плотные брюки, ботинки'][f.season];
    out.push(`На сезон «${SEASONS[f.season].toLowerCase()}» подходящих сочетаний нет. Понадобятся: ${need}.`);}

    const need={hot:'лёгкая футболка, шорты или юбка, лёгкая обувь',warm:'футболка или рубашка, джинсы или лёгкие брюки, кроссовки',cool:'лонгслив или свитер, лёгкая куртка или пиджак, закрытая обувь',cold:'тёплый свитер или худи, пальто или пуховик, ботинки'}[f.weather];
    out.push(`На погоду «${WEATHER[f.weather].toLowerCase()}» не хватает вещей. Понадобятся: ${need}.`);}
  if(f.rain&&only('rain',l=>l.rainOk))out.push('Для дождя нужна ветровка или плащ. В карточке куртки отметьте «Защищает от дождя».');
  if(f.occ&&only('occ',l=>l.occ.includes(f.occ)))out.push(`Для случая «${OCC[f.occ].n.toLowerCase()}» не хватает вещей: ${OCC_NEED[f.occ]}.`);
  if(f.colors.length&&only('colors',l=>f.colors.some(c=>l.colors.includes(c))))out.push('В готовых образах нет выбранных цветов. Добавьте вещи этого цвета или уберите цвет из фильтра.');

  if(!out.length)out.push('Каждый фильтр по отдельности даёт образы, но вместе они ничего не оставляют. Снимите один из фильтров.');

}

function patSvg(it){

  if(p==='check')for(let x=2;x<64;x+=9)o+=`<rect x="${x}" y="0" width="4" height="64" fill="${a}" opacity=".6"/>`;

}

function pickAccs(l){
  const all=S.items.filter(i=>i.cat==='acc'&&i.styles.includes(l.style)&&l.seasons.some(s=>i.seasons.includes(s)));
  const shoeC=l.shoes?.color;
  const sc=a=>(CK[a.color].neutral?1:0)+(l.colors.includes(a.color)?2:0)+(a.color===shoeC?1:0)-a.styles.indexOf(l.style)*.1;
  const ok=all.filter(a=>CK[a.color].neutral||l.colors.includes(a.color)).sort((a,b)=>sc(b)-sc(a));
  const by=s=>ok.find(a=>subOf(a)===s);const out=[];
  const bag=by('bag'),jw=by('jewelry'),wt=by('watch'),bt=l.base.length===2?by('belt'):null;
  [bag,jw,wt,bt].forEach(x=>{if(x)out.push(x);});
  const cold=l.seasons.includes(2)||l.seasons.includes(3);
  const pr=l.style==='business'?['scarf','glasses']:cold?['scarf','hat','glasses']:['glasses','hat','scarf'];
  for(const s of pr){const x=by(s);if(x){out.push(x);break;}}
  return out;
}
const ACC_STYLE={minimal:'одна аккуратная деталь, образ остаётся чистым',evening:'добавляет нарядности',casual:'деталь без усилий, образ выглядит завершённым',

  if(!sampleFn||!aiOK)return null;
  try{
    const r=await sampleFn.json(PROMPT,{images:blob,modelTier:'quick'});
    if(!r||!CATS[r.category])return null;
    const styles=(Array.isArray(r.styles)?r.styles:[]).filter(s=>STYLES[s]);
    const seasons=(Array.isArray(r.seasons)?r.seasons:[]).map(Number).filter(n=>n>=0&&n<4);
    const clamp=(v,a,b,d)=>Number.isFinite(+v)?Math.min(b,Math.max(a,Math.round(+v))):d;
    const hexes=(Array.isArray(r.colors)?r.colors:[r.color]).filter(h=>/^#[0-9a-f]{6}$/i.test(h||'')).slice(0,4);
    return{cat:r.category,name:String(r.name||'').slice(0,60),hex:hexes[0]||null,hexes,pattern:PATS[r.pattern]?r.pattern:'solid',styles,seasons,
      w:clamp(r.warmth,0,4,2),f:clamp(r.formality,1,5,2),fit:FITS[r.fit]?r.fit:'regular',rain:!!r.rain};
  }catch(e){return {err:e&&e.code||'x'};}
}
async function handleFiles(files){
  files=[...files].filter(f=>f.type.startsWith('image/'));
  if(!files.length){toast('Выберите файлы с изображениями.');return;}
  for(const file of files){
    const r={id:uid(),state:'work',thumb:URL.createObjectURL(file),itemId:null};UI.queue.unshift(r);updateQueue();
    try{
      const pr=await prepare(file);r.thumb=pr.img;
      const ai=await recognize(pr.blob);
      let it;
      if(ai&&!ai.err&&ai.name){
        const p=P.find(p=>p.cat===ai.cat)||P[0];
        const hex=ai.hex||pr.hex;
        let cols=[...new Set((ai.hexes.length?ai.hexes:[hex]).map(colorKey))];
        const pattern=cols.length>1&&ai.pattern==='solid'?'print':ai.pattern;
        if(pattern==='solid')cols=[cols[0]];
        it={id:uid(),name:ai.name,cat:ai.cat,hex,color:cols[0],colors:cols,pattern,styles:ai.styles.length?ai.styles:[...p.styles],seasons:ai.seasons.length?ai.seasons:[...p.seasons],
          w:ai.w,f:ai.f,fit:ai.fit,rain:ai.rain,img:pr.img};r.state='ai';
      }else{
        const p=P[0];it=mk('Новая вещь',p,pr.hex,pr.img,pr.cols.length>1?{colors:pr.cols,pattern:'print'}:null);r.state='manual';
        r.msg=(pr.cols.length>1?'Нашёл несколько цветов, вещь отмечена как принт: проверьте. ':'')+(!sampleFn||!aiOK?'Авто-распознавание недоступно здесь. Выберите тип вещи, цвет определён по фото.':ai?.err==='not_granted'?'Распознавание отключено. Выберите тип вещи, цвет определён по фото.':'Не удалось распознать. Выберите тип вещи, цвет определён по фото.');
      }
      S.items.unshift(it);r.itemId=it.id;save();$('#count').textContent=S.items.length+' '+plural(S.items.length,'вещь','вещи','вещей');
    }catch(e){r.state='manual';r.msg='Не удалось прочитать файл. Попробуйте другое фото.';}
    updateQueue();
  }
}

/* ===================== события ===================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,f=S.f;
  if(a==='fold'){e.preventDefault();UI.filtersOpen=!UI.filtersOpen;b.parentElement.open=UI.filtersOpen;return;}
  if(a==='edit'){openEdit(b.dataset.id);return;}
  if(a==='restore-demo'){restoreDemo();return;}
  if(a==='clear-demo'){S.items=S.items.filter(i=>!i.demo);S.demo=false;save();render();toast('Пример убран');return;}
  if(a==='cat')UI.cat=v;
  else if(a==='style')UI.style=v;
  else if(a==='more')UI.shown[v]=(UI.shown[v]||4)+4;
  else if(a==='f-season')f.season=f.season===+v?null:+v;
  else if(a==='f-weather')f.weather=f.weather===v?null:v;
  else if(a==='f-rain')f.rain=!f.rain;
  else if(a==='f-occ')f.occ=f.occ===v?null:v;
  else if(a==='f-color')f.colors=f.colors.includes(v)?f.colors.filter(c=>c!==v):[...f.colors,v];
  else if(a==='f-pat')f.pat=f.pat===v?null:v;
  else if(a==='wpat')UI.pat=!UI.pat;
  else if(a==='f-reset')S.f={season:null,weather:null,rain:false,occ:null,colors:[]};
  else return;
  if(a.startsWith('f-')){UI.shown={};save();}
  const y=window.scrollY;render();window.scrollTo(0,y);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){handleFiles(t.files);t.value='';}
  if(t.dataset?.act==='qpreset'){const it=S.items.find(i=>i.id===t.dataset.id),p=P[+t.value];if(!it||!p)return;
    Object.assign(it,{cat:p.cat,styles:[...p.styles],seasons:[...p.seasons],w:p.w,f:p.f,fit:p.fit,rain:p.rain,name:/Новая вещь/.test(it.name)?(CK[it.color].ru[0].toUpperCase()+CK[it.color].ru.slice(1)+' · '+p.name.toLowerCase()):it.name});
    const r=UI.queue.find(r=>r.itemId===it.id);if(r){r.state='ai';}save();updateQueue();toast('Тип вещи задан');}
});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFiles(e.dataTransfer.files);}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
load();render();
</script>
